[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-trading-bot"
version = "0.0.0"
description = "Automated Trading Bot repository bootstrap"
readme = "README.md"
dependencies = []
[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# Python compatibility policy is pending review of the audited baseline.

[tool.setuptools.packages.find]
where = ["src"]
include = ["automated_trading_bot", "automated_trading_bot.*"]
namespaces = false
