name: stage5-u3-native-qualification-059

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  plpython-feasibility:
    name: PostgreSQL 17.11 and PL/Python feasibility
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.10
      - name: Probe disposable PostgreSQL and PL/Python
        shell: pwsh
        env:
          EVIDENCE: ${{ runner.temp }}\atis-u3-native-059-probe
          PGDATA059: ${{ runner.temp }}\atis-u3-native-059-probe-data
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE | Out-Null
          $pgRoot = 'C:\Program Files\PostgreSQL\17'
          $pgBin = Join-Path $pgRoot 'bin'
          $postgres = Join-Path $pgBin 'postgres.exe'
          $initdb = Join-Path $pgBin 'initdb.exe'
          $pgctl = Join-Path $pgBin 'pg_ctl.exe'
          $psql = Join-Path $pgBin 'psql.exe'
          $control = Join-Path $pgRoot 'share\extension\plpython3u.control'
          $extensionSql = Get-ChildItem (Join-Path $pgRoot 'share\extension') -Filter 'plpython3u--*.sql' -ErrorAction SilentlyContinue
          $plpythonDll = Get-ChildItem $pgRoot -Recurse -Filter 'plpython3.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          $pythonExe = (Get-Command python).Source
          $pythonHome = Split-Path $pythonExe
          $pythonDll = Get-ChildItem $pythonHome -Recurse -Filter 'python312.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          $service = Get-Service -Name 'postgresql-x64-17' -ErrorAction SilentlyContinue
          $image = [ordered]@{
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            runner_arch = $env:RUNNER_ARCH
            windows = (Get-CimInstance Win32_OperatingSystem).Caption
            windows_build = (Get-CimInstance Win32_OperatingSystem).BuildNumber
            python = (& python --version 2>&1 | Out-String).Trim()
            postgres = (& $postgres --version 2>&1 | Out-String).Trim()
            service_status = if ($service) { [string]$service.Status } else { 'NOT_FOUND' }
            service_start_type = if ($service) { [string]$service.StartType } else { 'NOT_FOUND' }
            plpython_dll = if ($plpythonDll) { $plpythonDll.FullName } else { $null }
            plpython_control = if (Test-Path $control) { $control } else { $null }
            extension_sql = @($extensionSql.FullName)
            python_dll = if ($pythonDll) { $pythonDll.FullName } else { $null }
          }
          $image | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE 'runner-environment.json')
          $hashTargets = @($postgres, $initdb, $pgctl, $psql, $control)
          if ($plpythonDll) { $hashTargets += $plpythonDll.FullName }
          if ($pythonDll) { $hashTargets += $pythonDll.FullName }
          $hashTargets += @($extensionSql.FullName)
          $hashTargets | Where-Object { Test-Path $_ } | ForEach-Object {
            Get-FileHash -Algorithm SHA256 $_ | Select-Object Path, Hash
          } | ConvertTo-Json -Depth 3 | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE 'executable-hashes.json')
          if ($image.python -ne 'Python 3.12.10') { throw "Python identity mismatch: $($image.python)" }
          if ($image.postgres -notmatch '17\.11') { throw "PostgreSQL identity mismatch: $($image.postgres)" }
          if (-not $plpythonDll -or -not (Test-Path $control) -or @($extensionSql).Count -eq 0) {
            throw 'PLPYTHON3U_FILES_UNAVAILABLE'
          }
          if (-not $pythonDll) { throw 'PYTHON312_DLL_UNAVAILABLE' }
          $listener = [System.Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start(); $port = ([Net.IPEndPoint]$listener.LocalEndpoint).Port; $listener.Stop()
          $password = [Guid]::NewGuid().ToString('N') + 'Aa1!'
          $pwFile = Join-Path $env:RUNNER_TEMP 'atis-u3-native-059-pw.txt'
          Set-Content -NoNewline -Encoding ASCII -Path $pwFile -Value $password
          $env:PGPASSWORD = $password
          $env:PATH = "$pythonHome;$pgBin;$env:PATH"
          $started = $false
          try {
            & $initdb -D $env:PGDATA059 -U postgres --pwfile=$pwFile --auth-host=scram-sha-256 --auth-local=scram-sha-256 --encoding=UTF8 --no-locale | Out-File -Encoding UTF8 (Join-Path $env:EVIDENCE 'initdb.txt')
            if ($LASTEXITCODE -ne 0) { throw "initdb failed: $LASTEXITCODE" }
            Add-Content -Encoding ASCII (Join-Path $env:PGDATA059 'postgresql.conf') "`nlisten_addresses='127.0.0.1'`nport=$port`nlog_statement='all'`nlog_line_prefix='%m [%p] %q%u@%d '`n"
            & $pgctl -D $env:PGDATA059 -l (Join-Path $env:EVIDENCE 'postgres.log') -w -t 30 start | Out-File -Encoding UTF8 (Join-Path $env:EVIDENCE 'start.txt')
            if ($LASTEXITCODE -ne 0) { throw "pg_ctl start failed: $LASTEXITCODE" }
            $started = $true
            function Invoke-BoundedProbe([string]$Name, [string]$Sql) {
              $sqlFile = Join-Path $env:EVIDENCE "$Name.sql"
              $stdout = Join-Path $env:EVIDENCE "$Name.stdout.txt"
              $stderr = Join-Path $env:EVIDENCE "$Name.stderr.txt"
              "SET statement_timeout='10s'; SET lock_timeout='5s'; $Sql" | Set-Content -Encoding UTF8 $sqlFile
              $startedAt = [DateTimeOffset]::UtcNow
              [ordered]@{ probe=$Name; event='START'; at_utc=$startedAt.ToString('O') } |
                ConvertTo-Json -Compress | Add-Content -Encoding UTF8 (Join-Path $env:EVIDENCE 'probe-events.jsonl')
              $arguments = @('-X','-v','ON_ERROR_STOP=1','-h','127.0.0.1','-p',[string]$port,'-U','postgres','-d','postgres','-f',$sqlFile)
              $process = Start-Process -FilePath $psql -ArgumentList $arguments -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              $classification = 'COMPLETED'
              try {
                Wait-Process -Id $process.Id -Timeout 30 -ErrorAction Stop
              } catch {
                $classification = 'CLIENT_TIMEOUT'
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                Wait-Process -Id $process.Id -Timeout 5 -ErrorAction SilentlyContinue
              }
              $process.Refresh()
              $exitCode = if ($process.HasExited) { $process.ExitCode } else { $null }
              $endedAt = [DateTimeOffset]::UtcNow
              [ordered]@{ probe=$Name; event='END'; at_utc=$endedAt.ToString('O'); elapsed_ms=($endedAt-$startedAt).TotalMilliseconds; classification=$classification; exit_code=$exitCode } |
                ConvertTo-Json -Compress | Add-Content -Encoding UTF8 (Join-Path $env:EVIDENCE 'probe-events.jsonl')
              Copy-Item -Force (Join-Path $env:EVIDENCE 'postgres.log') (Join-Path $env:EVIDENCE "$Name.postgres.log")
              if ($classification -ne 'COMPLETED') { throw "PLPYTHON_$($Name.ToUpperInvariant())_CLIENT_TIMEOUT" }
              if ($exitCode -ne 0) { throw "PLPYTHON_$($Name.ToUpperInvariant())_EXIT_$exitCode" }
            }
            Invoke-BoundedProbe '01-create-extension' 'CREATE EXTENSION plpython3u;'
            Invoke-BoundedProbe '02-create-function' @'
          CREATE FUNCTION public.atis_python_probe() RETURNS text
          LANGUAGE plpython3u AS $$
          import sys
          return sys.version.split()[0]
          $$;
          '@
            Invoke-BoundedProbe '03-select-function' "SELECT current_setting('server_version') AS postgres_version, public.atis_python_probe() AS python_version;"
            $probe = Get-Content -Raw (Join-Path $env:EVIDENCE '03-select-function.stdout.txt')
            if ($probe -notmatch '17\.11') { throw 'PROBE_POSTGRES_VERSION_MISMATCH' }
            if ($probe -notmatch '3\.12\.10') { throw 'PROBE_PYTHON_VERSION_MISMATCH' }
            Invoke-BoundedProbe '04-drop-function' 'DROP FUNCTION public.atis_python_probe();'
            Invoke-BoundedProbe '05-drop-extension' 'DROP EXTENSION plpython3u;'
          } finally {
            if ($started) { & $pgctl -D $env:PGDATA059 -m fast -w -t 30 stop | Out-File -Encoding UTF8 (Join-Path $env:EVIDENCE 'stop.txt') }
            Remove-Item -Force -ErrorAction SilentlyContinue $pwFile
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $env:PGDATA059
            [ordered]@{ data_removed = -not (Test-Path $env:PGDATA059); service_status = if ($service) { [string](Get-Service $service.Name).Status } else { 'NOT_FOUND' } } |
              ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE 'cleanup.json')
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stage5-u3-native-059-plpython-probe
          path: ${{ runner.temp }}/atis-u3-native-059-probe/

  native-u3:
    name: Native U3 PostgreSQL qualification
    needs: plpython-feasibility
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.10
      - name: Install authenticated dependency lock
        shell: pwsh
        run: |
          python -m venv .venv-u3-059
          .\.venv-u3-059\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Provision fresh disposable U3 database
        shell: pwsh
        env:
          EVIDENCE: ${{ runner.temp }}\atis-u3-native-059
          PGDATA059: ${{ runner.temp }}\atis-u3-native-059-data
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE | Out-Null
          $pgRoot = 'C:\Program Files\PostgreSQL\17'; $pgBin = Join-Path $pgRoot 'bin'
          $initdb = Join-Path $pgBin 'initdb.exe'; $pgctl = Join-Path $pgBin 'pg_ctl.exe'; $psql = Join-Path $pgBin 'psql.exe'
          $pythonExe = (Resolve-Path '.\.venv-u3-059\Scripts\python.exe').Path
          $pythonHome = (& $pythonExe -c 'import sys; print(sys.base_prefix)').Trim()
          $listener = [System.Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start(); $port = ([Net.IPEndPoint]$listener.LocalEndpoint).Port; $listener.Stop()
          $password = [Guid]::NewGuid().ToString('N') + 'Aa1!'
          $pwFile = Join-Path $env:RUNNER_TEMP 'atis-u3-native-059-native-pw.txt'
          Set-Content -NoNewline -Encoding ASCII -Path $pwFile -Value $password
          $env:PGPASSWORD = $password; $env:PATH = "$pythonHome;$pgBin;$env:PATH"
          & $initdb -D $env:PGDATA059 -U postgres --pwfile=$pwFile --auth-host=scram-sha-256 --auth-local=scram-sha-256 --encoding=UTF8 --no-locale | Out-File -Encoding UTF8 (Join-Path $env:EVIDENCE 'initdb.txt')
          if ($LASTEXITCODE -ne 0) { throw "initdb failed: $LASTEXITCODE" }
          Add-Content -Encoding ASCII (Join-Path $env:PGDATA059 'postgresql.conf') "`nlisten_addresses='127.0.0.1'`nport=$port`n"
          & $pgctl -D $env:PGDATA059 -l (Join-Path $env:EVIDENCE 'postgres.log') -w -t 30 start | Out-File -Encoding UTF8 (Join-Path $env:EVIDENCE 'start.txt')
          if ($LASTEXITCODE -ne 0) { throw "pg_ctl start failed: $LASTEXITCODE" }
          $dsn = "host=127.0.0.1 port=$port user=postgres password=$password dbname=atis_u3_059 connect_timeout=5"
          & $psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p $port -U postgres -d postgres -c 'CREATE DATABASE atis_u3_059' | Out-File -Encoding UTF8 (Join-Path $env:EVIDENCE 'create-db.txt')
          foreach ($migration in @('0001_soe_commit_boundary.sql','0002_scope_publication.sql','0003_u3_registry_authority.sql')) {
            & $psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p $port -U postgres -d atis_u3_059 -f "src/automated_trading_bot/stage5/commit_boundary/sql/$migration" | Out-File -Append -Encoding UTF8 (Join-Path $env:EVIDENCE 'migrations.txt')
            if ($LASTEXITCODE -ne 0) { throw "migration failed: $migration" }
          }
          $rolesSql = Join-Path $env:EVIDENCE 'roles.sql'
          @"
          CREATE ROLE u045_verifier LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD '$password';
          CREATE ROLE u045_runtime LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD '$password';
          CREATE ROLE u045_registry LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD '$password';
          GRANT atis_soe_verifier TO u045_verifier;
          GRANT atis_soe_runtime TO u045_runtime;
          GRANT atis_soe_registry_migrator TO u045_registry;
          "@ | Set-Content -Encoding UTF8 $rolesSql
          & $psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p $port -U postgres -d atis_u3_059 -f $rolesSql | Out-File -Encoding UTF8 (Join-Path $env:EVIDENCE 'roles.txt')
          $repo = (Resolve-Path '.').Path
          $paths = @((Join-Path $pythonHome 'DLLs'), (Join-Path $pythonHome 'Lib'), (Join-Path $repo 'src'))
          $hashes = [ordered]@{}
          Get-ChildItem (Join-Path $repo 'src') -Recurse -Filter '*.py' | Sort-Object FullName | ForEach-Object { $hashes[$_.FullName] = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant() }
          $pathsJson = ($paths | ConvertTo-Json -Compress).Replace("'", "''")
          $hashesJson = ($hashes | ConvertTo-Json -Compress).Replace("'", "''")
          [ordered]@{ python_paths=$paths; module_hashes=$hashes } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE 'config.json')
          $configSql = "INSERT INTO atis_soe.u3_verifier_configuration VALUES(true,ARRAY['$($paths[0].Replace("'","''"))','$($paths[1].Replace("'","''"))','$($paths[2].Replace("'","''"))'],'$hashesJson'::jsonb);"
          & $psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p $port -U postgres -d atis_u3_059 -c $configSql | Out-File -Encoding UTF8 (Join-Path $env:EVIDENCE 'config-insert.txt')
          [ordered]@{ port=$port; dsn=$dsn; password_file=$pwFile; python_home=$pythonHome } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:RUNNER_TEMP 'atis-u3-native-059-state.json')
      - name: Probe authenticated U3 PL/Python imports
        shell: pwsh
        env:
          EVIDENCE: ${{ runner.temp }}\atis-u3-native-059
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'atis-u3-native-059-state.json') | ConvertFrom-Json
          $env:PGPASSWORD = Get-Content -Raw $state.password_file
          $psql = 'C:\Program Files\PostgreSQL\17\bin\psql.exe'
          $sqlFile = Join-Path $env:EVIDENCE 'u3-import-probe.sql'
          $stdout = Join-Path $env:EVIDENCE 'u3-import-probe.stdout.txt'
          $stderr = Join-Path $env:EVIDENCE 'u3-import-probe.stderr.txt'
          "SET statement_timeout='15s'; SELECT atis_soe.verify_u3_signature('INVALID',decode('','hex'),decode('','hex'));" | Set-Content -Encoding UTF8 $sqlFile
          $arguments = @('-X','-v','ON_ERROR_STOP=1','-h','127.0.0.1','-p',[string]$state.port,'-U','postgres','-d','atis_u3_059','-f',$sqlFile)
          $startedAt = [DateTimeOffset]::UtcNow
          $process = Start-Process -FilePath $psql -ArgumentList $arguments -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Wait-Process -Id $process.Id -Timeout 30 -ErrorAction Stop
          } catch {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'U3_PLPYTHON_IMPORT_PROBE_CLIENT_TIMEOUT'
          }
          $process.Refresh()
          [ordered]@{ started_at_utc=$startedAt.ToString('O'); ended_at_utc=[DateTimeOffset]::UtcNow.ToString('O'); exit_code=$process.ExitCode } |
            ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE 'u3-import-probe.json')
          if ($process.ExitCode -ne 0) { throw "U3_PLPYTHON_IMPORT_PROBE_EXIT_$($process.ExitCode)" }
          if ((Get-Content -Raw $stdout) -notmatch 'U3_CAPABILITY_REJECTED') { throw 'U3_PLPYTHON_IMPORT_PROBE_UNEXPECTED_RESULT' }
      - name: Run native U3 qualification
        shell: pwsh
        env:
          EVIDENCE: ${{ runner.temp }}\atis-u3-native-059
          PGDATA059: ${{ runner.temp }}\atis-u3-native-059-data
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'atis-u3-native-059-state.json') | ConvertFrom-Json
          $env:ATIS_U3_TEST_DSN = $state.dsn
          $env:ATIS_U3_TEST_DATA = $env:PGDATA059
          $env:ATIS_U3_TEST_EVIDENCE = Join-Path $env:EVIDENCE 'durable-probes.jsonl'
          $env:ATIS_U3_TEST_CONFIG = Join-Path $env:EVIDENCE 'config.json'
          $env:PYTHONPATH = "$(Resolve-Path src);$(Resolve-Path tests)"
          .\.venv-u3-059\Scripts\python.exe -m compileall -q src tests
          .\.venv-u3-059\Scripts\python.exe -m ruff check . 2>&1 | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'ruff.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Ruff failed' }
          .\.venv-u3-059\Scripts\python.exe -m mypy --strict src 2>&1 | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'mypy.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Strict mypy failed' }
          .\.venv-u3-059\Scripts\python.exe -m pytest -p no:cacheprovider -vv --tb=long tests/test_stage5_postgres_scope_verification.py tests/test_stage5_scope_registry.py 2>&1 | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'pytest-u3.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Native U3 pytest failed' }
          $psql = 'C:\Program Files\PostgreSQL\17\bin\psql.exe'
          $postgresDsn = $state.dsn.Replace('dbname=atis_u3_059', 'dbname=postgres')
          & $psql -X -v ON_ERROR_STOP=1 -d $postgresDsn -c 'CREATE DATABASE atis_u3_059_legacy' | Out-File -Encoding UTF8 (Join-Path $env:EVIDENCE 'legacy-create.txt')
          $legacyDsn = $state.dsn.Replace('dbname=atis_u3_059', 'dbname=atis_u3_059_legacy')
          foreach ($migration in @('0001_soe_commit_boundary.sql','0002_scope_publication.sql')) {
            & $psql -X -v ON_ERROR_STOP=1 -d $legacyDsn -f "src/automated_trading_bot/stage5/commit_boundary/sql/$migration" | Out-File -Append -Encoding UTF8 (Join-Path $env:EVIDENCE 'legacy-migrations.txt')
            if ($LASTEXITCODE -ne 0) { throw "legacy setup failed: $migration" }
          }
          & $psql -X -v ON_ERROR_STOP=1 -d $legacyDsn -c "INSERT INTO atis_soe.scope_identity(catalogue_epoch,canonical_key,kind,namespace,identity,canonical_bytes,active) VALUES(1,'legacy','GLOBAL','legacy','legacy',decode('00','hex'),true)" | Out-File -Append -Encoding UTF8 (Join-Path $env:EVIDENCE 'legacy-migrations.txt')
          $legacyOutput = & $psql -X -v ON_ERROR_STOP=1 -d $legacyDsn -f 'src/automated_trading_bot/stage5/commit_boundary/sql/0003_u3_registry_authority.sql' 2>&1 | Out-String
          $legacyOutput | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE 'legacy-rejection.txt')
          if ($LASTEXITCODE -eq 0 -or $legacyOutput -notmatch 'U3_UNSUPPORTED_NONEMPTY_LEGACY_MIGRATION') { throw 'Legacy migration rejection was not proven' }
          & $psql -X -v ON_ERROR_STOP=1 -d $postgresDsn -c 'DROP DATABASE atis_u3_059_legacy WITH (FORCE)' | Out-File -Append -Encoding UTF8 (Join-Path $env:EVIDENCE 'legacy-rejection.txt')
      - name: Stop and remove disposable database
        if: always()
        shell: pwsh
        env:
          EVIDENCE: ${{ runner.temp }}\atis-u3-native-059
          PGDATA059: ${{ runner.temp }}\atis-u3-native-059-data
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE | Out-Null
          $pgctl = 'C:\Program Files\PostgreSQL\17\bin\pg_ctl.exe'
          if (Test-Path (Join-Path $env:PGDATA059 'postmaster.pid')) { & $pgctl -D $env:PGDATA059 -m fast -w -t 30 stop | Out-File -Encoding UTF8 (Join-Path $env:EVIDENCE 'stop.txt') }
          $statePath = Join-Path $env:RUNNER_TEMP 'atis-u3-native-059-state.json'
          if (Test-Path $statePath) {
            $state = Get-Content -Raw $statePath | ConvertFrom-Json
            Remove-Item -Force -ErrorAction SilentlyContinue $state.password_file
          }
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'atis-u3-native-059-native-pw.txt')
          Remove-Item -Force -ErrorAction SilentlyContinue $statePath
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $env:PGDATA059
          [ordered]@{ data_removed = -not (Test-Path $env:PGDATA059); service_status = [string](Get-Service -Name 'postgresql-x64-17' -ErrorAction SilentlyContinue).Status } |
            ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:EVIDENCE 'cleanup.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stage5-u3-native-059-evidence
          include-hidden-files: true
          path: ${{ runner.temp }}/atis-u3-native-059/
